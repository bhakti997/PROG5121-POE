name: Java Tests

# Runs the unit tests automatically whenever code is pushed
# or a pull request is opened against master.
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Downloads the repository code onto the GitHub runner
      - name: Check out code
        uses: actions/checkout@v4

      # Installs the same Java version set in pom.xml (release 26)
      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'temurin'
          cache: maven

      # Compiles the project and runs LoginTest and MessageTest
      - name: Run unit tests with Maven
        run: mvn --batch-mode test
